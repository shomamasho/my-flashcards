<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>暗記カード</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-sub: #64748b;
      --primary: #2563eb;
      --border: #e2e8f0;
      --red: #ef4444;
      --orange: #f97316;
      --blue: #3b82f6;
      --green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ナビゲーションバー */
    nav {
      display: flex;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }

    nav button {
      flex: 1;
      padding: 14px 0;
      border: none;
      background: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
    }

    nav button.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }

    /* メインコンテナ */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .view {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .view.active {
      display: flex;
    }

    /* フィルターエリア */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    select {
      flex: 1;
      min-width: 130px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      font-size: 14px;
      color: var(--text);
    }

    /* フラッシュカード */
    .flashcard-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .flashcard {
      width: 100%;
      height: 320px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      position: relative;
      user-select: none;
      transition: transform 0.1s ease;
    }

    .flashcard:active {
      transform: scale(0.98);
    }

    .flashcard-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 12px;
      padding: 4px 8px;
      background: var(--bg);
      border-radius: 6px;
      color: var(--text-sub);
    }

    .flashcard-hint {
      position: absolute;
      bottom: 16px;
      font-size: 12px;
      color: var(--text-sub);
    }

    .flashcard-content {
      font-size: 20px;
      font-weight: 500;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .flashcard-type {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 8px;
    }

    /* 評価アクションボタン */
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .btn-action {
      padding: 12px 4px;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .btn-action span {
      font-size: 10px;
      font-weight: normal;
      opacity: 0.9;
    }

    .btn-unknown { background: var(--red); }
    .btn-hard    { background: var(--orange); }
    .btn-good    { background: var(--blue); }
    .btn-perfect { background: var(--green); }

    /* カード追加・一覧 */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    textarea, input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .btn-primary {
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }

    .card-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-item-title {
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .card-item-meta {
      font-size: 12px;
      color: var(--text-sub);
    }

    .btn-del {
      background: none;
      border: none;
      color: var(--red);
      font-size: 13px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      color: var(--text-sub);
      margin-top: 60px;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <nav>
    <button id="nav-review" class="active" onclick="switchTab('review')">復習</button>
    <button id="nav-manage" onclick="switchTab('manage')">単語管理</button>
  </nav>

  <main>
    <!-- 復習画面 -->
    <div id="view-review" class="view active">
      <div class="filter-bar">
        <select id="filter-tag" onchange="renderReviewCard()">
          <option value="all">すべてのタグ</option>
        </select>
        <select id="filter-status" onchange="renderReviewCard()">
          <option value="due">期日の問題（通常）</option>
          <option value="all">全ステータス（常に復習）</option>
          <option value="unknown">「分からない」のみ</option>
          <option value="hard">「難しい」のみ</option>
          <option value="good">「分かった」のみ</option>
          <option value="perfect">「完璧」のみ</option>
        </select>
      </div>

      <div class="flashcard-container" id="study-area">
        <!-- カード本体 -->
        <div class="flashcard" id="card" onclick="flipCard()">
          <div class="flashcard-badge" id="card-tag">タグ</div>
          <div class="flashcard-type" id="card-type">問題</div>
          <div class="flashcard-content" id="card-text">問題文がここに表示されます</div>
          <div class="flashcard-hint">タップで裏返す</div>
        </div>

        <!-- 4段階評価ボタン -->
        <div class="action-grid" style="width: 100%;">
          <button class="btn-action btn-unknown" onclick="gradeCard('unknown')">
            分からない
            <span>+30分</span>
          </button>
          <button class="btn-action btn-hard" onclick="gradeCard('hard')">
            難しい
            <span>+1日</span>
          </button>
          <button class="btn-action btn-good" onclick="gradeCard('good')">
            分かった
            <span>+3日</span>
          </button>
          <button class="btn-action btn-perfect" onclick="gradeCard('perfect')">
            もう完璧
            <span>+7日</span>
          </button>
        </div>
      </div>

      <div id="no-cards" class="empty-state" style="display: none;">
        復習するカードはありません！🎉
      </div>
    </div>

    <!-- 単語管理画面 -->
    <div id="view-manage" class="view">
      <div class="form-group">
        <textarea id="inp-q" placeholder="問題文を入力"></textarea>
        <textarea id="inp-a" placeholder="解答を入力"></textarea>
        <input type="text" id="inp-tag" placeholder="タグ名（例: 基本情報, 英単語）">
        <button class="btn-primary" onclick="addCard()">問題を追加</button>
      </div>

      <div class="card-list" id="card-list"></div>
    </div>
  </main>

  <script>
    const INTERVALS = {
      unknown: 30 * 60 * 1000,           // 30分
      hard:    1 * 24 * 60 * 60 * 1000,  // 1日
      good:    3 * 24 * 60 * 60 * 1000,  // 3日
      perfect: 7 * 24 * 60 * 60 * 1000   // 7日
    };

    let cards = JSON.parse(localStorage.getItem('cards_app_data')) || [];
    let currentCard = null;
    let isFlipped = false;

    function save() {
      localStorage.setItem('cards_app_data', JSON.stringify(cards));
      updateTagDropdown();
      renderManageList();
    }

    function switchTab(tab) {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

      if (tab === 'review') {
        document.getElementById('nav-review').classList.add('active');
        document.getElementById('view-review').classList.add('active');
        renderReviewCard();
      } else {
        document.getElementById('nav-manage').classList.add('active');
        document.getElementById('view-manage').classList.add('active');
        renderManageList();
      }
    }

    function addCard() {
      const q = document.getElementById('inp-q').value.trim();
      const a = document.getElementById('inp-a').value.trim();
      const tag = document.getElementById('inp-tag').value.trim() || '未分類';

      if (!q || !a) {
        alert('問題と解答を入力してください');
        return;
      }

      const newCard = {
        id: Date.now().toString(),
        q: q,
        a: a,
        tag: tag,
        status: 'new',
        nextReview: Date.now() // 作成後すぐ復習可能
      };

      cards.push(newCard);
      save();

      document.getElementById('inp-q').value = '';
      document.getElementById('inp-a').value = '';
      alert('カードを保存しました');
    }

    function deleteCard(id) {
      if (confirm('このカードを削除しますか？')) {
        cards = cards.filter(c => c.id !== id);
        save();
        renderReviewCard();
      }
    }

    function updateTagDropdown() {
      const tagSelect = document.getElementById('filter-tag');
      const currentSelected = tagSelect.value;
      const tags = [...new Set(cards.map(c => c.tag))];

      tagSelect.innerHTML = '<option value="all">すべてのタグ</option>';
      tags.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        tagSelect.appendChild(opt);
      });
      tagSelect.value = currentSelected;
    }

    function getFilteredCards() {
      const tagFilter = document.getElementById('filter-tag').value;
      const statusFilter = document.getElementById('filter-status').value;
      const now = Date.now();

      return cards.filter(c => {
        if (tagFilter !== 'all' && c.tag !== tagFilter) return false;

        if (statusFilter === 'due') {
          return c.nextReview <= now;
        } else if (statusFilter === 'all') {
          return true; // 常に全件復習
        } else {
          return c.status === statusFilter; // 指定理解度のみ
        }
      });
    }

    function renderReviewCard() {
      const list = getFilteredCards();
      const studyArea = document.getElementById('study-area');
      const emptyState = document.getElementById('no-cards');

      if (list.length === 0) {
        studyArea.style.display = 'none';
        emptyState.style.display = 'block';
        currentCard = null;
        return;
      }

      studyArea.style.display = 'flex';
      emptyState.style.display = 'none';

      // 復習優先順（期日が近い順）
      list.sort((a, b) => a.nextReview - b.nextReview);
      currentCard = list[0];
      isFlipped = false;
      displayCardContent();
    }

    function flipCard() {
      if (!currentCard) return;
      isFlipped = !isFlipped;
      displayCardContent();
    }

    function displayCardContent() {
      if (!currentCard) return;
      const tagEl = document.getElementById('card-tag');
      const typeEl = document.getElementById('card-type');
      const textEl = document.getElementById('card-text');

      tagEl.textContent = currentCard.tag;

      if (!isFlipped) {
        typeEl.textContent = '問題';
        typeEl.style.color = 'var(--primary)';
        textEl.textContent = currentCard.q;
      } else {
        typeEl.textContent = '解答';
        typeEl.style.color = 'var(--green)';
        textEl.textContent = currentCard.a;
      }
    }

    function gradeCard(grade) {
      if (!currentCard) return;

      currentCard.status = grade;
      currentCard.nextReview = Date.now() + INTERVALS[grade];
      save();
      renderReviewCard();
    }

    function renderManageList() {
      const container = document.getElementById('card-list');
      container.innerHTML = '';

      if (cards.length === 0) {
        container.innerHTML = '<div class="empty-state">登録されたカードはありません</div>';
        return;
      }

      cards.slice().reverse().forEach(c => {
        const item = document.createElement('div');
        item.className = 'card-item';
        
        const statusMap = {
          new: '未学習',
          unknown: '分からない',
          hard: '難しい',
          good: '分かった',
          perfect: '完璧'
        };

        item.innerHTML = `
          <div>
            <div class="card-item-title">${escapeHtml(c.q)}</div>
            <div class="card-item-meta">
              [${escapeHtml(c.tag)}] 状態: ${statusMap[c.status] || c.status}
            </div>
          </div>
          <button class="btn-del" onclick="deleteCard('${c.id}')">削除</button>
        `;
        container.appendChild(item);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // 初期化
    updateTagDropdown();
    renderReviewCard();
  </script>
</body>
</html>
